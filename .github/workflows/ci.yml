name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reverse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-tests:
    name: Contracts and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.lock
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python test dependencies
        run: python -m pip install -r windows/requirements.lock
      - name: Run repository checks
        run: pnpm run check
      - name: Verify Copilot against the current official schema
        if: runner.os == 'Linux'
        run: pnpm run verify:copilot
      - name: Verify a sealed class fork from a clean checkout
        run: pnpm run test:e2e -- --require-distribution-ready
