name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reverse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-platforms:
    name: ChatGPT and Copilot contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Run active-platform checks
        # 원본 교육과정 PDF는 공개 저장소에 없으므로 CI는 추적 계약만 검증한다.
        # 로컬 릴리스의 check:active는 실제 PDF 바이트·SHA 검증을 계속 수행한다.
        # Agents Toolkit 검증은 Microsoft 계정 로그인이 필요하므로 CI에서는 실행하지 않는다.
        run: pnpm run check:ci
      - name: Audit Node dependencies
        run: pnpm audit --audit-level low

  web-surface:
    name: Web surface and deploy build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Verify web surface
        working-directory: apps/web
        run: pnpm run check
      - name: Verify GitHub Pages export
        working-directory: apps/web
        env:
          GITHUB_PAGES: 'true'
        run: pnpm run build
